name: Production Worker Deployment (No D1 Migrations)

on:
  workflow_dispatch:
    inputs:
      approval_phrase:
        description: "Type DEPLOY-AUDIT-RETENTION to authorize a production Worker-only deployment"
        required: true
        type: string

concurrency:
  group: vansvriksh-production-worker-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/main' && inputs.approval_phrase == 'DEPLOY-AUDIT-RETENTION'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout validated main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate production Worker configuration
        run: pnpm --filter @family-tree/api exec wrangler deploy --dry-run --outdir /tmp/vansvriksh-production-dry-run --env production

      - name: Require production D1 to have no pending migrations
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @family-tree/api exec wrangler d1 migrations list vansvriksh-production --remote --env production | tee /tmp/production-migrations.txt
          pending="$(sed -n '/Migrations to be applied:/,$p' /tmp/production-migrations.txt | grep -oE '[0-9]{4}_[[:alnum:]_]+\.sql' || true)"
          if [ -n "$pending" ]; then
            echo "Refusing Worker-only deployment because production D1 has pending migrations."
            printf '%s\n' "$pending"
            exit 1
          fi

      - name: Deploy production Worker (no D1 writes)
        run: pnpm --filter @family-tree/api exec wrangler deploy --env production

      - name: Verify production API health
        run: |
          response="$(curl --fail --silent --show-error https://api.vansvriksh.vtrrk.in/health)"
          printf '%s\n' "$response"
          printf '%s' "$response" | grep -F '"environment":"production"'
          printf '%s' "$response" | grep -F '"database":"connected"'
