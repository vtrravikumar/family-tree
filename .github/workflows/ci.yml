name: CI and Development Deployment

on:
  push:
    branches: [preview, main, production]
  pull_request:
    branches: [preview, main, production]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate production Worker configuration (dry run)
        if: github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'production')
        run: pnpm --filter @family-tree/api exec wrangler deploy --dry-run --outdir /tmp/vansvriksh-production-dry-run --env production

      - name: Verify production portrait bucket exists
        if: github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'production')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare credentials are unavailable; production R2 existence cannot be verified."
            exit 1
          fi
          pnpm --filter @family-tree/api exec wrangler r2 bucket list | tee /tmp/vansvriksh-r2-buckets.txt
          grep -F "vansvriksh-person-photos-production" /tmp/vansvriksh-r2-buckets.txt
          pnpm --filter @family-tree/api exec wrangler d1 migrations list vansvriksh-production --remote --env production | tee /tmp/vansvriksh-production-migrations.txt
          pnpm --filter @family-tree/api exec wrangler r2 bucket dev-url get vansvriksh-person-photos-production | tee /tmp/vansvriksh-production-r2-dev-url.txt
          grep -F "Public access via the r2.dev URL is disabled." /tmp/vansvriksh-production-r2-dev-url.txt
          pnpm --filter @family-tree/api exec wrangler r2 bucket domain list vansvriksh-person-photos-production | tee /tmp/vansvriksh-production-r2-domains.txt
          grep -F "There are no custom domains connected to this bucket." /tmp/vansvriksh-production-r2-domains.txt

  deploy-development:
    if: github.event_name == 'push' && github.ref == 'refs/heads/preview'
    needs: validate
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Apply D1 migrations to development database
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: pnpm --filter @family-tree/api exec wrangler d1 migrations apply vansvriksh-dev --remote --env dev

      - name: Deploy API to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: pnpm --filter @family-tree/api exec wrangler deploy --env dev

      - name: Explain skipped deployment
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "Worker deployment skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets. The frontend deploys directly through Cloudflare Pages Git integration."
