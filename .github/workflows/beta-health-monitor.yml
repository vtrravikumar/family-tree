name: Beta API health monitor

on:
  push:
    branches: [preview]
    paths:
      - ".github/workflows/beta-health-monitor.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Simulate a monitor failure to verify GitHub issue alerting"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: beta-api-health-monitor
  cancel-in-progress: false

jobs:
  health:
    name: Verify API health and database connectivity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Simulate controlled monitor failure
        if: ${{ inputs.simulate_failure }}
        run: |
          echo "Intentional failure requested to verify the alert path."
          exit 1

      - name: Check development API
        env:
          HEALTH_URL: https://api-dev.vansvriksh.vtrrk.in/health
          EXPECTED_ENVIRONMENT: development
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --location \
            --retry 2 --retry-delay 5 --max-time 20 "$HEALTH_URL")"
          printf '%s\n' "$response" | jq -e \
            --arg expected "$EXPECTED_ENVIRONMENT" \
            '.status == "ok" and .database == "connected" and .environment == $expected' \
            >/dev/null

      - name: Check production API
        env:
          HEALTH_URL: https://api.vansvriksh.vtrrk.in/health
          EXPECTED_ENVIRONMENT: production
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --location \
            --retry 2 --retry-delay 5 --max-time 20 "$HEALTH_URL")"
          printf '%s\n' "$response" | jq -e \
            --arg expected "$EXPECTED_ENVIRONMENT" \
            '.status == "ok" and .database == "connected" and .environment == $expected' \
            >/dev/null

  notify:
    name: Create an actionable GitHub alert
    needs: health
    if: ${{ always() && needs.health.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Open or reuse an alert issue
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `[Beta health alert] API health check failed (run ${context.runNumber})`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const duplicate = existing.data.find(issue =>
              !issue.pull_request && issue.title === title && issue.body?.includes(runUrl)
            );

            if (duplicate) {
              core.notice(`Alert already exists: #${duplicate.number}`);
              return;
            }

            const body = [
              "## Vansvriksh beta health monitor failure",
              "",
              "The scheduled or manually triggered health monitor failed to verify one or both API environments.",
              "",
              `- Workflow: ${context.workflow}`,
              `- Branch/ref: ${context.ref}`,
              `- Commit: ${context.sha}`,
              `- Run: ${runUrl}`,
              "",
              "This alert intentionally contains no API response body, family data, credentials or request payloads.",
              "",
              "Operator actions:",
              "1. Open the workflow run and identify which environment check failed.",
              "2. Verify API and D1 health without exposing user data.",
              "3. Record the incident and close this issue only after service is healthy and the cause is understood."
            ].join("\n");

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              assignees: ["vtrravikumar"]
            });
            core.notice(`Created assigned alert issue #${created.data.number}`);
