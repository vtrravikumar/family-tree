name = "family-tree-api"
main = "src/index.ts"
compatibility_date = "2025-01-15"
# Custom domain is managed in the Cloudflare dashboard.
# Keep workers.dev disabled; deploy code without modifying zone routes.
workers_dev = false

[vars]
APP_ENV = "development"

[env.dev]
name = "family-tree-api-dev"
workers_dev = false

[env.dev.vars]
APP_ENV = "development"

# D1 and R2 bindings will be added as isolated resources for dev,
# staging, and production when those services are introduced.
