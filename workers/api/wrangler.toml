name = "family-tree-api"
main = "src/index.ts"
compatibility_date = "2025-01-15"
# Worker Custom Domains are declared per environment below.
# Keep workers.dev disabled; these hosts do not share routes with other products.
workers_dev = false

[vars]
APP_ENV = "development"
GOOGLE_CLIENT_ID = "569004813603-bgdrv8dmth1po7hvn84ke5jq9vmkkalt.apps.googleusercontent.com"
INITIAL_OWNER_EMAIL = "vtrravikumar@gmail.com"
SUPER_ADMIN_EMAIL = "vtrravikumar@gmail.com"

[env.dev]
name = "family-tree-api-dev"
workers_dev = false

[[env.dev.routes]]
pattern = "api-dev.vansvriksh.vtrrk.in"
custom_domain = true

[[env.dev.d1_databases]]
binding = "DB"
database_name = "vansvriksh-dev"
database_id = "6a646ce7-f920-489a-a274-002ce158c9ae"
migrations_dir = "migrations"

[env.dev.vars]
APP_ENV = "development"
GOOGLE_CLIENT_ID = "569004813603-bgdrv8dmth1po7hvn84ke5jq9vmkkalt.apps.googleusercontent.com"
INITIAL_OWNER_EMAIL = "vtrravikumar@gmail.com"
SUPER_ADMIN_EMAIL = "vtrravikumar@gmail.com"
ALLOWED_ORIGINS = "https://vansvriksh-web-dev.pages.dev,https://dev.vansvriksh.vtrrk.in,https://vansvriksh.vtrrk.in,http://localhost:5173,http://127.0.0.1:5173"

# This production database was created empty for the friends-and-family beta.
# Keep production migrations and deployment manual until explicitly approved.
[env.production]
name = "family-tree-api-production"
workers_dev = false

[[env.production.routes]]
pattern = "api.vansvriksh.vtrrk.in"
custom_domain = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "vansvriksh-production"
database_id = "661c073a-20be-491c-bed0-104594e5c4cb"
migrations_dir = "migrations"

[env.production.vars]
APP_ENV = "production"
GOOGLE_CLIENT_ID = "569004813603-bgdrv8dmth1po7hvn84ke5jq9vmkkalt.apps.googleusercontent.com"
SUPER_ADMIN_EMAIL = "vtrravikumar@gmail.com"
INITIAL_OWNER_EMAIL = ""
ALLOWED_ORIGINS = "https://vansvriksh.vtrrk.in"

# Production invocation logs for the Control 15 security review.
[env.production.observability]
enabled = true
head_sampling_rate = 1

[env.production.observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[env.production.observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[env.production.observability.issues]
enabled = false
